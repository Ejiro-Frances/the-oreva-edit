project_id = "the-oreva-edit"
[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000
[db]
port = 54322
shadow_port = 54320
major_version = 17
[db.seed]
enabled = true
sql_paths = ["./seed.sql"]
[studio]
enabled = true
port = 54323
api_url = "http://127.0.0.1"
[auth]
enabled = true
site_url = "http://localhost:3100"
additional_redirect_urls = [
  "http://localhost:3000/auth/callback",
  "http://localhost:3100/auth/callback",
  "http://localhost:3000/auth/confirm",
  "http://localhost:3100/auth/confirm",
]
jwt_expiry = 3600
enable_signup = true
minimum_password_length = 8
[auth.rate_limit]
# Local only: lets browser tests send several verification and reset emails per hour.
email_sent = 30
[auth.email]
enable_signup = true
# Customers sign in immediately; the store tracks verification in profiles.email_verified_at.
enable_confirmations = false
otp_expiry = 3600
[auth.email.template.magic_link]
subject = "Verify your email for The Oreva Edit"
content_path = "./supabase/templates/verify-email.html"
[auth.email.template.recovery]
subject = "Reset your password for The Oreva Edit"
content_path = "./supabase/templates/reset-password.html"
[inbucket]
# Local mail catcher (Mailpit) used by the browser tests: http://127.0.0.1:54324
enabled = true
port = 54324
[storage]
enabled = true
file_size_limit = "5MiB"
[analytics]
enabled = false
